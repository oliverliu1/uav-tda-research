name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # gudhi/persim/scikit-learn-extra install from prebuilt PyPI wheels on
      # linux/py3.9 -- verified 2026-09-22 via `pip download --no-deps
      # --python-version 39 --platform manylinux2014_x86_64 --only-binary=:all:`
      # for gudhi==3.10.1 (highest PyPI release; pyproject.toml only pins
      # gudhi>=3.9, so this is what resolves here), persim==0.3.8 (pure
      # Python), and scikit-learn-extra==0.3.0 (manylinux2010 wheel). None
      # require a source build or a conda/apt fallback on this runner.
      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # The dataset (data/UAVIDS-2025.csv) IS in the repo and present on this
      # checkout; outputs/ artifacts are not (gitignored, produced only by
      # running the pipeline locally). Artifact-dependent tests self-skip
      # here via tests/conftest.py's `requires_data` guard when a test would
      # otherwise need pre-existing outputs/; the data-dependent smoke test
      # runs (~90s cold). Golden-master tests reading the committed
      # `results/tables/**` oracles are unguarded and always run.
      - name: Fast test suite
        run: python -m pytest -m "not slow" -q
